[package]
name = "ponto"
version = "1.0.0"
description = "Multilingual translation app built with Tauri 2, using the DeepL and Lara engines."
authors = ["Alexandre Vuillet"]
license = "Apache-2.0"
repository = "https://github.com/avuillet93TheFrenchy/Ponto.git"
edition = "2024"
rust-version = "1.99.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }
dotenvy = "0.15.7"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-sentry = "0.8"
sentry = { version = "0.49.3", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "release-health", "reqwest", "rustls" ] }
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls"] }
base64 = "0.23.1"
hmac = "0.13.0"
sha2 = "0.11.1"
md-5 = "0.11"
httpdate = "1.0.3"
tokio = { version = "1.53.3", features = ["sync", "macros", "rt"] }
tauri-plugin-opener = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# Read-aloud: most WebKitGTK builds have no Web Speech API (see src/tts.rs).
[target.'cfg(target_os = "linux")'.dependencies]
speech-dispatcher = "0.16"

[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1.0.9"

[dev-dependencies]
dotenvy = "0.15.7"
