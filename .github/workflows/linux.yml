name: Linux
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  rust:
    name: Rust check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libspeechd-dev patchelf rpm

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The runner's preinstalled Rust can be older than `rust-version` in Cargo.toml.
      - name: Update Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      - name: Build frontend
        run: pnpm build

      - name: Cargo check and tests
        working-directory: src-tauri
        run: |
          cargo check --locked
          cargo test --locked

      # Unsigned bundles: the updater key is not available in CI, so updater artifacts are off.
      - name: Build bundles (AppImage, deb, rpm)
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: pnpm tauri build --bundles appimage,deb,rpm --config '{"bundle":{"createUpdaterArtifacts":false}}'
