sonar.projectKey=avuillet93TheFrenchy_Ponto
sonar.organization=avuillet93thefrenchy


# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=Ponto
sonar.projectVersion=1.0.0
sonar.language=js

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=index.html, src

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8


# Tests are analysed as tests, not as sources (their lines must not count as code to cover).
sonar.tests=__tests__
sonar.test.inclusions=__tests__/**

# Coverage report written by `pnpm test:coverage` (Vitest, lcov reporter).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Entry points, excluded from coverage the same way as `coverage.exclude` in vitest.config.ts.
sonar.coverage.exclusions=src/main.js,src/instrument.js
